[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-reclaim"
version = "0.1.0"
description = "Predicting idle LLM inference instances for GPU reclamation (Alibaba MaaS trace v2026)"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
